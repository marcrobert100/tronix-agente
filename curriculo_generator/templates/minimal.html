<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{nome} - Curriculum Vitae</title>
    <style>
        * {{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }}
        body {{
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #fff;
            color: #111;
            line-height: 1.5;
        }}
        .container {{
            max-width: 800px;
            margin: 0 auto;
        }}
        .header {{
            padding: 50px 0 40px;
            border-bottom: 2px solid #111;
        }}
        .nome {{
            font-size: 3em;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }}
        .titulo {{
            font-size: 1.1em;
            color: #666;
            margin-bottom: 25px;
            font-weight: 400;
        }}
        .contato {{
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            font-size: 0.9em;
            color: #555;
        }}
        .contato-item {{
            display: flex;
            align-items: center;
            gap: 8px;
        }}
        .destaques-container {{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-bottom: 1px solid #eee;
        }}
        .destaque {{
            padding: 30px 20px;
            text-align: center;
            border-right: 1px solid #eee;
        }}
        .destaque:last-child {{
            border-right: none;
        }}
        .destaque-numero {{
            font-size: 2em;
            font-weight: 700;
            display: block;
            color: #111;
        }}
        .destaque-texto {{
            font-size: 0.8em;
            color: #888;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }}
        .content {{
            padding: 40px 0;
        }}
        .section {{
            margin-bottom: 40px;
        }}
        .section-title {{
            font-size: 0.75em;
            font-weight: 700;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }}
        .experiencia-item, .formacao-item {{
            margin-bottom: 25px;
        }}
        .item-header {{
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 5px;
        }}
        .item-titulo {{
            font-size: 1em;
            font-weight: 700;
            color: #111;
        }}
        .item-periodo {{
            font-size: 0.85em;
            color: #888;
        }}
        .item-subtitulo {{
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }}
        .item-descricao {{
            color: #555;
            font-size: 0.95em;
        }}
        .competencias-list {{
            display: flex;
            flex-direction: column;
            gap: 12px;
        }}
        .competencia {{
            display: flex;
            align-items: center;
            gap: 15px;
        }}
        .competencia-nome {{
            min-width: 180px;
            font-size: 0.95em;
            color: #333;
        }}
        .competencia-barra {{
            flex: 1;
            height: 4px;
            background: #eee;
        }}
        .competencia-fill {{
            height: 100%;
        }}
        .competencia-porc {{
            min-width: 45px;
            text-align: right;
            font-size: 0.85em;
            color: #888;
        }}
        .certificacoes-list {{
            display: flex;
            flex-direction: column;
            gap: 12px;
        }}
        .certificacao {{
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-bottom: 12px;
            border-bottom: 1px solid #f5f5f5;
        }}
        .certificacao-nome {{
            font-weight: 600;
            color: #333;
        }}
        .certificacao-info {{
            font-size: 0.85em;
            color: #888;
        }}
        .idiomas-grid {{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }}
        .idioma {{
            text-align: center;
            padding: 20px;
            border: 1px solid #eee;
        }}
        .idioma-nome {{
            font-weight: 700;
            color: #111;
            margin-bottom: 5px;
        }}
        .idioma-nivel {{
            font-size: 0.85em;
            color: #888;
        }}
        .conhecimentos-list {{
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }}
        .conhecimento {{
            padding: 6px 14px;
            border: 1px solid #ddd;
            font-size: 0.85em;
            color: #555;
        }}
        @media print {{
            .container {{ max-width: 100%; }}
        }}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="nome">{nome}</h1>
            <p class="titulo">{titulo}</p>
            <div class="contato">
                {contato_itens}
            </div>
        </div>

        <div class="destaques-container">
            {destaques_html}
        </div>

        <div class="content">
            {experiencia_html}
            {formacao_html}
            {competencias_html}
            {certificacoes_html}
            {idiomas_html}
            {conhecimentos_html}
        </div>
    </div>
</body>
</html>
