<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{nome} - Curriculum Vitae</title>
    <style>
        * {{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }}
        body {{
            font-family: 'Georgia', serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }}
        .container {{
            max-width: 850px;
            margin: 30px auto;
            background: #fff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }}
        .header {{
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            padding: 40px 50px;
            position: relative;
            overflow: hidden;
        }}
        .header::before {{
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 400px;
            height: 400px;
            background: linear-gradient(45deg, transparent, rgba(212,175,55,0.1));
            border-radius: 50%;
        }}
        .header-content {{
            position: relative;
            z-index: 1;
        }}
        .nome {{
            font-size: 2.5em;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }}
        .titulo {{
            font-size: 1.3em;
            color: #d4af37;
            font-style: italic;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }}
        .contato {{
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 0.9em;
        }}
        .contato-item {{
            display: flex;
            align-items: center;
            gap: 8px;
        }}
        .destaques-container {{
            background: linear-gradient(135deg, #d4af37 0%, #b8960c 100%);
            padding: 25px 50px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
        }}
        .destaque {{
            text-align: center;
            color: #1a1a2e;
        }}
        .destaque-numero {{
            font-size: 2em;
            font-weight: 800;
            display: block;
        }}
        .destaque-texto {{
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }}
        .content {{
            padding: 40px 50px;
        }}
        .section {{
            margin-bottom: 30px;
        }}
        .section-title {{
            font-size: 1.4em;
            color: #1a1a2e;
            border-bottom: 3px solid #d4af37;
            padding-bottom: 8px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }}
        .experiencia-item, .formacao-item {{
            margin-bottom: 20px;
            padding-left: 15px;
            border-left: 3px solid #d4af37;
        }}
        .item-header {{
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
        }}
        .item-titulo {{
            font-size: 1.1em;
            font-weight: 700;
            color: #333;
        }}
        .item-subtitulo {{
            color: #666;
            font-style: italic;
        }}
        .item-periodo {{
            color: #d4af37;
            font-weight: 600;
            font-size: 0.9em;
        }}
        .item-descricao {{
            margin-top: 8px;
            color: #555;
        }}
        .competencias-grid {{
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }}
        .competencia {{
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f9f9f9;
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 0.9em;
        }}
        .competencia-barra {{
            width: 60px;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }}
        .competencia-fill {{
            height: 100%;
            border-radius: 3px;
        }}
        .certificacao {{
            padding: 10px 15px;
            background: #f9f9f9;
            border-left: 3px solid #d4af37;
            margin-bottom: 10px;
        }}
        .idiomas-grid {{
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }}
        .idioma {{
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }}
        .idioma-nome {{
            font-weight: 700;
            color: #333;
        }}
        .idioma-nivel {{
            color: #d4af37;
            font-size: 0.85em;
        }}
        .conhecimentos-list {{
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }}
        .conhecimento {{
            background: #1a1a2e;
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
        }}
        @media print {{
            body {{ background: #fff; }}
            .container {{ box-shadow: none; margin: 0; }}
        }}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1 class="nome">{nome}</h1>
                <p class="titulo">{titulo}</p>
                <div class="contato">
                    {contato_itens}
                </div>
            </div>
        </div>

        <div class="destaques-container">
            {destaques_html}
        </div>

        <div class="content">
            {experiencia_html}
            {formacao_html}
            {competencias_html}
            {certificacoes_html}
            {idiomas_html}
            {conhecimentos_html}
        </div>
    </div>
</body>
</html>
