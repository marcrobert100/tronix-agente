<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robo Zukinha</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --cream: #fdf8f0;
  --coral: #ff7a5a;
  --gold: #ffd700;
  --gold-light: #f5a623;
  --blue-sky: #e3f2fd;
  --night: #0b081a;
  --text-dark: #1a1a2e;
  --text-soft: #4a3f4a;
}
body {
  font-family: 'Quicksand', sans-serif;
  background: linear-gradient(160deg,#ffeedd 0%,#ffe3ec 50%,#e3f2ff 100%);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
}
.book {
  width:min(880px,100%); background:var(--cream); border-radius:28px;
  box-shadow:0 18px 50px rgba(140,90,60,.22); overflow:hidden; position:relative;
}
.page { display:none; animation:pop .45s ease; }
.page.active { display:block; }
@keyframes pop { from { opacity:0; transform:translateX(28px);} to { opacity:1; transform:none;} }
.art { width:100%; background:#fff; border-bottom:6px dotted var(--gold); }
.art svg { width:100%; height:auto; display:block; }
.content { padding:26px 34px 20px; text-align:center; }
.content p {
  font-family: 'Playfair Display', serif;
  font-size:clamp(19px,2.6vw,25px); line-height:1.75; color:var(--text-dark); letter-spacing:.5px;
}
.content .dialogue {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  color: var(--coral);
  margin-top: 12px;
  font-size: clamp(17px,2.2vw,22px);
}
.cover .content h1 {
  font-family: 'Playfair Display', serif;
  font-size:clamp(30px,5vw,44px); color:var(--coral); margin-bottom:8px;
}
.cover .content h2 {
  font-family: 'Quicksand', sans-serif;
  font-size:clamp(15px,2.2vw,19px); color:#a0886b; font-weight:normal; margin-bottom:6px;
}
.badge { display:inline-block; background:#ffe9c7; color:#c07830; border-radius:999px; padding:4px 14px; font-size:14px; margin-bottom:14px; }
.btn {
  border:none; cursor:pointer; border-radius:999px; font-family:'Quicksand',sans-serif;
  transition:transform .12s, box-shadow .12s;
}
.btn:active { transform:scale(.94); }
.btn:focus-visible { outline:3px solid #385e98; outline-offset:3px; }
.btn-big {
  background:var(--coral); color:#fff; font-size:21px; padding:14px 44px;
  box-shadow:0 6px 0 #e07f2e; margin:10px 0 6px;
}
.btn-play {
  background:#6bc86b; color:#fff; font-size:17px; padding:10px 26px;
  box-shadow:0 5px 0 #4da34d; margin-top:14px;
}
.btn-play.playing { background:#f4766e; box-shadow:0 5px 0 #c9534c; }
.nav {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 22px 20px; gap:10px;
}
.btn-nav {
  background:var(--gold); color:#9a6a2f; font-size:18px; padding:9px 22px; box-shadow:0 4px 0 #e6b877;
}
.btn-nav:disabled { opacity:.35; cursor:default; box-shadow:none; }
.dots { display:flex; gap:7px; flex-wrap:wrap; justify-content:center; }
.dot { width:11px; height:11px; border-radius:50%; background:#eadbc4; cursor:pointer; transition:.2s; }
.dot.on { background:var(--coral); transform:scale(1.35); }
.toolbar { position:absolute; top:14px; right:16px; z-index:5; display:flex; gap:8px; }
.btn-auto { background:#8fb8f0; color:#fff; font-size:14px; padding:8px 16px; box-shadow:0 4px 0 #6c93c9; }
.btn-auto.on { background:#f4766e; box-shadow:0 4px 0 #c9534c; }
.btn-whatsapp { background:#25d366; color:#fff; font-size:14px; padding:8px 16px; box-shadow:0 4px 0 #1da851; }
.btn-pdf { background:#e74c3c; color:#fff; font-size:14px; padding:8px 16px; box-shadow:0 4px 0 #c0392b; }
.pageno { font-size:13px; color:#c4ab88; margin-top:10px; }
.end-emoji { font-size:56px; margin:6px 0 10px; }
.page-number { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); font-size:12px; color:rgba(255,255,255,0.7); }
@media (max-width:560px) {
  body { padding:8px; }
  .book { border-radius:18px; }
  .content { padding:22px 20px 16px; }
  .nav { padding:12px 12px 16px; }
  .btn-nav { padding:9px 14px; font-size:16px; }
  .toolbar { top:10px; right:10px; }
}
</style>
</head>
<body>
<div class="book" id="livro">
  <div class="toolbar">
    <button class="btn btn-pdf" type="button" onclick="exportarPDF()">📄 PDF</button>
    <button class="btn btn-whatsapp" type="button" onclick="compartilharWhatsApp()">📱 WhatsApp</button>
    <button class="btn btn-auto" id="autoBtn" type="button" onclick="toggleAuto()">…</button>
  </div>
  <div id="pages" aria-live="polite"></div>
  <div class="nav" aria-label="Navegação">
    <button class="btn btn-nav" id="prevBtn" type="button" onclick="go(-1)"></button>
    <div class="dots" id="dots" aria-label="Selecionar página"></div>
    <button class="btn btn-nav" id="nextBtn" type="button" onclick="go(1)"></button>
  </div>
</div>

const T = {
  listen:'🔊 Ouvir história', stop:'⏹ Parar', open:'Abrir livro 📖', again:'Ler de novo 🔄',
  prev:'← Anterior', next:'Próxima →', auto:'▶ Auto-leitura', autoStop:'⏹ Parar auto-leitura',
  theEnd:'— Fim —', endText:'Obrigado por ler! Boa noite!', ages:'Idade',
  noTts:'Seu navegador não suporta narração. Tente Chrome ou Edge.',
  whatsapp:'Compartilhar no WhatsApp',
  pdf:'Salvar como PDF'
};

function escaparHTML(valor) {
  return String(valor ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[char]);
}
function textoHTML(valor) {
  return escaparHTML(valor).replace(/\r?\n/g, '<br>');
}
function svgHTML(valor) {
  return typeof valor === 'string' ? valor : '';
}
function el(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  return d.firstElementChild;
}

/* ---------- Render ---------- */
const pagesEl = document.getElementById('pages');
const dotsEl = document.getElementById('dots');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const total = LIVRO.paginas.length + 2;
let cur = 0;
let auto = false;

prevBtn.textContent = T.prev;
nextBtn.textContent = T.next;
prevBtn.setAttribute('aria-label', T.prev);
nextBtn.setAttribute('aria-label', T.next);

pagesEl.appendChild(el(`<div class="page cover active">
  <div class="art">${svgHTML(LIVRO.capa_svg)}</div>
  <div class="content">
    <h1>${escaparHTML(LIVRO.titulo)}</h1>
    <h2>${escaparHTML(LIVRO.subtitulo || '')}</h2>
    <div class="badge">${escaparHTML(T.ages)} ${escaparHTML(LIVRO.faixa_etaria || '2 — 6 anos')}</div><br>
    <button class="btn btn-big" type="button" onclick="go(1)">${escaparHTML(T.open)}</button>
  </div>
</div>`));

LIVRO.paginas.forEach((p, i) => {
  const dialogue = p.dialogo ? `<div class="dialogue">${textoHTML(p.dialogo)}</div>` : '';
  pagesEl.appendChild(el(`<div class="page">
    <div class="art">${svgHTML(p.svg)}</div>
    <div class="content">
      <p>${textoHTML(p.texto)}</p>
      ${dialogue}
      <button class="btn btn-play" type="button" data-idx="${i}" onclick="togglePlay(${i}, this)">${escaparHTML(T.listen)}</button>
      <div class="pageno">${i + 1} / ${LIVRO.paginas.length}</div>
    </div>
  </div>`));
});

pagesEl.appendChild(el(`<div class="page">
  <div class="content" style="padding:70px 34px;">
    <div class="end-emoji" aria-hidden="true">🌙✨</div>
    <h1 style="color:var(--coral);font-size:34px;margin-bottom:14px;font-family:'Playfair Display',serif;">${escaparHTML(T.theEnd)}</h1>
    <p>${textoHTML(LIVRO.texto_final || T.endText)}</p>
    <button class="btn btn-big" type="button" onclick="irInicio()">${escaparHTML(T.again)}</button>
  </div>
</div>`));

for (let i = 0; i < total; i++) {
  const d = document.createElement('button');
  d.type = 'button';
  d.className = 'dot' + (i === 0 ? ' on' : '');
  d.setAttribute('aria-label', `Ir para página ${i + 1}`);
  d.onclick = () => show(i);
  dotsEl.appendChild(d);
}

function show(i) {
  pararSom();
  cur = Math.max(0, Math.min(total - 1, i));
  document.querySelectorAll('.page').forEach((p, k) => p.classList.toggle('active', k === cur));
  document.querySelectorAll('.dot').forEach((d, k) => d.classList.toggle('on', k === cur));
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === total - 1;
  if (auto) autoLer();
}
function go(delta) { show(cur + delta); }
function irInicio() { auto = false; syncAutoBtn(); show(0); }
document.addEventListener('keydown', event => {
  if (event.key === 'ArrowRight') go(1);
  if (event.key === 'ArrowLeft') go(-1);
});

/* ---------- Player: áudio embutido primeiro, fallback narração ---------- */
let curAudio = null;
let curBtn = null;
let curUtter = null;
let playToken = 0;

function escolherVoz() {
  const voices = speechSynthesis.getVoices();
  const preferred = /Lucia|Google português|Natural|Microsoft/i;
  return voices.find(v => v.lang.startsWith('pt') && preferred.test(v.name))
      || voices.find(v => v.lang.startsWith('pt'))
      || null;
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();

function pararSom() {
  playToken += 1;
  if (curAudio) {
    curAudio.onended = null;
    curAudio.onerror = null;
    curAudio.pause();
    curAudio = null;
  }
  if (curUtter) {
    curUtter.onstart = null;
    curUtter.onend = null;
    curUtter.onerror = null;
    curUtter = null;
  }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (curBtn) {
    curBtn.classList.remove('playing');
    curBtn.textContent = T.listen;
    curBtn = null;
  }
}

function tocarPagina(i, btn, onEnd) {
  pararSom();
  const token = playToken;
  const pagina = LIVRO.paginas[i];
  const textoCompleto = [pagina.texto, pagina.dialogo].filter(Boolean).join(' ');
  const done = ok => {
    if (token !== playToken) return;
    if (btn) {
      btn.classList.remove('playing');
      btn.textContent = T.listen;
    }
    curBtn = null;
    curAudio = null;
    curUtter = null;
    if (onEnd) onEnd(ok !== false);
  };
  if (btn) {
    btn.classList.add('playing');
    btn.textContent = T.stop;
    curBtn = btn;
  }
  if (pagina.audio) {
    curAudio = new Audio(pagina.audio);
    curAudio.onended = () => done(true);
    curAudio.onerror = () => {
      curAudio = null;
      falar(textoCompleto, done, token);
    };
    curAudio.play().catch(() => {
      curAudio = null;
      falar(textoCompleto, done, token);
    });
  } else {
    falar(textoCompleto, done, token);
  }
}

function falar(texto, done, token) {
  if (!('speechSynthesis' in window)) {
    alert(T.noTts);
    done(false);
    return;
  }
  const utterance = new SpeechSynthesisUtterance(String(texto || '').replace(/<[^>]+>/g, ''));
  utterance.lang = 'pt-BR';
  utterance.rate = 0.85;
  utterance.pitch = 1.1;
  const voz = escolherVoz();
  if (voz) utterance.voice = voz;
  let started = false;
  const startedAt = Date.now();
  utterance.onstart = () => { started = true; };
  utterance.onend = () => done(started || Date.now() - startedAt > 500);
  utterance.onerror = () => done(false);
  curUtter = utterance;
  speechSynthesis.speak(utterance);
}

function togglePlay(i, btn) {
  if (curBtn === btn) {
    auto = false;
    syncAutoBtn();
    pararSom();
    return;
  }
  auto = false;
  syncAutoBtn();
  tocarPagina(i, btn, null);
}

/* ---------- Auto-leitura ---------- */
function syncAutoBtn() {
  const button = document.getElementById('autoBtn');
  button.classList.toggle('on', auto);
  button.textContent = auto ? T.autoStop : T.auto;
  button.setAttribute('aria-label', button.textContent);
}
function toggleAuto() {
  auto = !auto;
  syncAutoBtn();
  if (auto) {
    if (cur === 0 || cur === total - 1) show(1);
    else autoLer();
  } else {
    pararSom();
  }
}
function autoLer() {
  if (!auto) return;
  if (cur === 0 || cur === total - 1) {
    auto = false;
    syncAutoBtn();
    return;
  }
  const idx = cur - 1;
  const pageAtStart = cur;
  const btn = document.querySelector(`.btn-play[data-idx="${idx}"]`);
  tocarPagina(idx, btn, ok => {
    if (!ok) {
      auto = false;
      syncAutoBtn();
      return;
    }
    if (auto && cur === pageAtStart) {
      setTimeout(() => {
        if (auto && cur === pageAtStart) go(1);
      }, 700);
    }
  });
}

/* ---------- WhatsApp ---------- */
function compartilharWhatsApp() {
  const texto = encodeURIComponent(`📖 ${LIVRO.titulo}\n\n${LIVRO.subtitulo || ''}\n\nLeia no InfoEngine!`);
  window.open(`https://wa.me/${WHATSAPP_NUM}?text=${texto}`, '_blank');
}

/* ---------- PDF ---------- */
function exportarPDF() {
  const element = document.getElementById('livro');
  const opt = {
    margin: 10,
    filename: `${LIVRO.titulo.replace(/\s+/g, '_')}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };
  html2pdf().set(opt).from(element).save();
}

syncAutoBtn();
show(0);
</script>
