<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gerar Ícones PNG - Stitch Contos</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0b081a; color:#fff; font-family:system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; padding:2rem; }
  h1 { color:#ffd700; margin-bottom:0.5rem; }
  p { color:rgba(255,255,255,0.6); margin-bottom:2rem; }
  .grid { display:flex; gap:2rem; flex-wrap:wrap; justify-content:center; }
  .card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,215,0,0.2); border-radius:16px; padding:1.5rem; text-align:center; }
  .card h3 { color:#ffd700; margin-bottom:0.5rem; }
  canvas { border-radius:12px; background:#0b081a; display:block; margin:1rem auto; }
  .btn { background:#ff7a30; color:#fff; border:none; padding:0.6rem 1.4rem; border-radius:8px; cursor:pointer; font-size:0.9rem; margin-top:0.5rem; }
  .btn:hover { background:#e66928; }
  .note { margin-top:2rem; font-size:0.85rem; color:rgba(255,255,255,0.4); max-width:500px; text-align:center; }
  code { background:rgba(255,255,255,0.1); padding:0.1rem 0.4rem; border-radius:4px; font-size:0.8rem; }
</style>
</head>
<body>
  <h1>🪡 Gerar Ícones PNG</h1>
  <p>Clique para gerar e baixar os ícones do PWA</p>
  <div class="grid" id="icons"></div>
  <div class="note">
    <p>Os ícones SVG já funcionam em navegadores modernos (Chrome 96+).<br>
    Use esta página para gerar PNG se precisar de compatibilidade máxima.</p>
    <p style="margin-top:0.5rem">Depois de baixar, salve em <code>assets/icons/</code> como <code>icon-192.png</code> e <code>icon-512.png</code></p>
  </div>

<script>
const sizes = [
  { name: 'icon-192.png', size: 192, maskable: false },
  { name: 'icon-512.png', size: 512, maskable: false },
  { name: 'icon-192-maskable.png', size: 192, maskable: true },
  { name: 'icon-512-maskable.png', size: 512, maskable: true },
];

function drawIcon(canvas, size, maskable) {
  const ctx = canvas.getContext('2d');
  const s = size;
  const cx = s / 2, cy = maskable ? s / 2 : s * 0.35;

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, s, s);
  grad.addColorStop(0, '#0f0c2e');
  grad.addColorStop(1, '#1a1a5e');
  
  if (maskable) {
    roundRect(ctx, 0, 0, s, s, s * 0.18);
    ctx.fillStyle = grad;
    ctx.fill();
  } else {
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, s, s);
  }

  // Star (sun)
  const sr = s * 0.16;
  ctx.beginPath();
  ctx.arc(cx, cy, sr, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,215,0,0.15)';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, sr * 0.6, 0, Math.PI * 2);
  ctx.fillStyle = '#ffd700';
  ctx.fill();

  // Eyes
  const eyeY = cy - sr * 0.2;
  const eyeR = s * 0.028;
  ctx.beginPath();
  ctx.arc(cx - sr * 0.32, eyeY, eyeR, 0, Math.PI * 2);
  ctx.fillStyle = '#7a5500';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + sr * 0.32, eyeY, eyeR, 0, Math.PI * 2);
  ctx.fill();

  // Smile
  ctx.beginPath();
  ctx.arc(cx, cy + sr * 0.2, sr * 0.32, 0.1, Math.PI - 0.1);
  ctx.strokeStyle = '#7a5500';
  ctx.lineWidth = s * 0.012;
  ctx.stroke();

  // Rays
  const rayCount = 6;
  for (let i = 0; i < rayCount; i++) {
    const angle = (i / rayCount) * Math.PI * 2 - Math.PI / 2;
    const x1 = cx + Math.cos(angle) * sr;
    const y1 = cy + Math.sin(angle) * sr;
    const x2 = cx + Math.cos(angle) * (sr * 1.7);
    const y2 = cy + Math.sin(angle) * (sr * 1.7);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = i % 2 === 0 ? '#ff7a30' : '#ffb347';
    ctx.lineWidth = s * 0.02;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.6;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Bottom decorations
  if (!maskable) {
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    roundRect(ctx, s * 0.28, s * 0.75, s * 0.2, s * 0.08, s * 0.016);
    ctx.fill();

    ctx.fillStyle = '#ff7a30';
    ctx.globalAlpha = 0.3;
    roundRect(ctx, s * 0.52, s * 0.73, s * 0.18, s * 0.07, s * 0.02);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.beginPath();
    ctx.arc(s * 0.6, s * 0.76, s * 0.03, 0, Math.PI * 2);
    ctx.fillStyle = '#ff7a30';
    ctx.globalAlpha = 0.5;
    ctx.fill();
    ctx.globalAlpha = 1;

    // Small eyes on decoration
    ctx.beginPath();
    ctx.arc(s * 0.585, s * 0.755, s * 0.008, 0, Math.PI * 2);
    ctx.fillStyle = '#7a3a00';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(s * 0.615, s * 0.755, s * 0.008, 0, Math.PI * 2);
    ctx.fill();
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function downloadPNG(canvas, filename) {
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

document.addEventListener('DOMContentLoaded', () => {
  const grid = document.getElementById('icons');
  
  sizes.forEach(({ name, size, maskable }) => {
    const card = document.createElement('div');
    card.className = 'card';
    
    const h3 = document.createElement('h3');
    h3.textContent = `${size}x${size}${maskable ? ' (maskable)' : ''}`;
    card.appendChild(h3);

    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    canvas.style.width = Math.min(size, 128) + 'px';
    canvas.style.height = Math.min(size, 128) + 'px';
    drawIcon(canvas, size, maskable);
    card.appendChild(canvas);

    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = '⬇ Baixar ' + name;
    btn.onclick = () => downloadPNG(canvas, name);
    card.appendChild(btn);

    grid.appendChild(card);
  });
});
</script>
</body>
</html>
