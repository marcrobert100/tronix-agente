name: Build Portaria Facial APK

on:
  push:
    paths:
      - 'portaria_facial/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libffi-dev \
            python3-dev \
            git \
            zip \
            unzip \
            openjdk-17-jdk-headless \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            pkg-config

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 31
          ndk-version: r25c
          build-tools-version: 37.0.0

      - name: Link Android SDK for Buildozer
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk
          ln -sf $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
          # Verify build-tools exists
          ls -la ~/.buildozer/android/platform/android-sdk/build-tools/

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK
        working-directory: ./portaria_facial
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: portaria-facial-apk
          path: portaria_facial/bin/*.apk
          retention-days: 30