name: Build Portaria Facial APK

on:
  push:
    paths:
      - 'portaria_facial/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        working-directory: /github/workspace/portaria_facial
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: portaria-facial-apk
          path: portaria_facial/bin/*.apk
          retention-days: 30