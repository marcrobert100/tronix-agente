name: 🤖 Auto-Evolução — Agente DEV

on:
  schedule:
    - cron: '0 6 * * 1'  # Toda segunda às 06:00 UTC
  workflow_dispatch:       # Permite execução manual
    inputs:
      foco:
        description: 'Área de evolução'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - performance
          - features
          - refactor
          - docs
          - security

jobs:
  analyze-and-evolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar CrewAI e dependências
        run: |
          pip install crewai crewai-tools

      - name: 📊 Análise de código
        id: analyze
        run: |
          echo "## 📊 Análise Automática" > evolucao_report.md
          echo "" >> evolucao_report.md

          echo "### Arquivos modificados recentemente" >> evolucao_report.md
          git log --oneline --name-only -10 --pretty=format:"- %s" >> evolucao_report.md
          echo "" >> evolucao_report.md

          echo "### Métricas" >> evolucao_report.md
          echo "- Total de arquivos Python: $(find . -name '*.py' -not -path './node_modules/*' | wc -l)" >> evolucao_report.md
          echo "- Total de arquivos PHP: $(find . -name '*.php' -not -path './node_modules/*' | wc -l)" >> evolucao_report.md
          echo "- Total de linhas Python: $(find . -name '*.py' -not -path './node_modules/*' -exec cat {} + | wc -l)" >> evolucao_report.md
          echo "" >> evolucao_report.md

          echo "### Sugestões de melhoria" >> evolucao_report.md
          echo "- [ ] Revisar imports não utilizados" >> evolucao_report.md
          echo "- [ ] Verificar error handling" >> evolucao_report.md
          echo "- [ ] Atualizar docstrings" >> evolucao_report.md

      - name: 🚀 Executar agente de evolução
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python .github/scripts/agente_evolucao.py \
            --report evolucao_report.md \
            --foco ${{ github.event.inputs.foco || 'auto' }} \
            --branch ${GITHUB_REF_NAME}

      - name: 📤 Publicar report
        uses: actions/upload-artifact@v4
        with:
          name: evolucao-report
          path: evolucao_report.md

      - name: 🏷️ Criar Issue de evolução
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('evolucao_report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🤖 Relatório de Evolução Semanal — ${new Date().toISOString().split('T')[0]}`,
              body: report,
              labels: ['evolução', 'automated']
            });
