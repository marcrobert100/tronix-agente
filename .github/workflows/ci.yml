name: CI — Validação e Qualidade

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pyright
      - name: Lint Python
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          black --check --diff . || true

  lint-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Syntax check PHP
        run: |
          find . -name "*.php" -not -path "./node_modules/*" -not -path "./vendor/*" -exec php -l {} \;

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Procurar credenciais expostas
        run: |
          grep -rn "sk-[a-zA-Z0-9]" --include="*.py" --include="*.php" --include="*.json" --include="*.env" . || echo "Nenhuma chave exposta encontrada"
        continue-on-error: true

  validate-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JSONs
        run: |
          find . -name "*.json" -not -path "./node_modules/*" -exec sh -c 'python -m json.tool "$1" > /dev/null 2>&1 || echo "INVALIDO: $1"' _ {} \;
