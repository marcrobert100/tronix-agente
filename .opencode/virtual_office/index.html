<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Office - Agentes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0a0f;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            color: #00ff88;
        }
        
        #office {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: 
                radial-gradient(ellipse at 50% 0%, #1a1a2e 0%, transparent 50%),
                linear-gradient(180deg, #0f0f1a 0%, #0a0a0f 100%);
        }
        
        .grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        
        .desk {
            position: absolute;
            width: 120px;
            height: 60px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16162a 100%);
            border: 1px solid #00ff8844;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #00ff8888;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0,255,136,0.1);
        }
        
        .agent {
            position: absolute;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: left 0.3s ease, top 0.3s ease;
            cursor: pointer;
            z-index: 100;
        }
        
        .agent-body {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            animation: pulse 2s infinite;
            box-shadow: 0 0 20px currentColor;
        }
        
        .agent-status {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            white-space: nowrap;
            color: #00ff88;
            text-shadow: 0 0 5px #00ff88;
        }
        
        .agent-task {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            white-space: nowrap;
            color: #ffaa00;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        .agent.working .agent-body {
            animation: working 0.5s infinite;
        }
        
        @keyframes working {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        
        .agent.idle .agent-body {
            animation: idle 3s infinite;
        }
        
        @keyframes idle {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        
        #info-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(10, 10, 15, 0.9);
            border: 1px solid #00ff8844;
            padding: 15px;
            border-radius: 8px;
            min-width: 250px;
            z-index: 1000;
        }
        
        #info-panel h3 {
            color: #00ff88;
            margin-bottom: 10px;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        #info-panel .stat {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin: 5px 0;
            color: #00ff8888;
        }
        
        #info-panel .stat span:last-child {
            color: #00ff88;
        }
        
        #log {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 150px;
            background: rgba(10, 10, 15, 0.9);
            border: 1px solid #00ff8844;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            font-size: 10px;
            z-index: 1000;
        }
        
        #log .entry {
            margin: 3px 0;
            color: #00ff8888;
        }
        
        #log .entry .time {
            color: #ffaa00;
        }
        
        #log .entry .type {
            color: #00ffff;
        }
        
        #log .entry.agent-add { color: #00ff88; }
        #log .entry.task-add { color: #ffaa00; }
        #log .entry.status-change { color: #00ffff; }
        
        #title {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }
        
        #title h1 {
            font-size: 24px;
            color: #00ff88;
            text-shadow: 0 0 20px #00ff88;
            letter-spacing: 4px;
        }
        
        #title p {
            font-size: 10px;
            color: #00ff8888;
            letter-spacing: 2px;
        }
        
        .computer {
            position: absolute;
            width: 40px;
            height: 30px;
            background: #1a1a2e;
            border: 1px solid #00ff8844;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        .computer::before {
            content: '💻';
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="office">
        <div class="grid"></div>
        
        <div class="desk" style="left: 100px; top: 150px;" data-desk="explore">Explore</div>
        <div class="desk" style="left: 300px; top: 150px;" data-desk="frontend">Frontend</div>
        <div class="desk" style="left: 500px; top: 150px;" data-desk="backend">Backend</div>
        <div class="desk" style="left: 700px; top: 150px;" data-desk="database">Database</div>
        
        <div class="desk" style="left: 100px; top: 350px;" data-desk="test">Test</div>
        <div class="desk" style="left: 300px; top: 350px;" data-desk="deploy">Deploy</div>
        <div class="desk" style="left: 500px; top: 350px;" data-desk="debug">Debug</div>
        <div class="desk" style="left: 700px; top: 350px;" data-desk="review">Review</div>
        
        <div id="agents-container"></div>
    </div>
    
    <div id="title">
        <h1>VIRTUAL OFFICE</h1>
        <p>AGENTES TRABALHANDO</p>
    </div>
    
    <div id="info-panel">
        <h3>Status</h3>
        <div class="stat"><span>Agentes:</span><span id="agent-count">0</span></div>
        <div class="stat"><span>Online:</span><span id="online-count">0</span></div>
        <div class="stat"><span>Trabalhando:</span><span id="working-count">0</span></div>
        <div class="stat"><span>Tarefas:</span><span id="task-count">0</span></div>
        <div class="stat"><span>Conectado:</span><span id="connected">○</span></div>
    </div>
    
    <div id="log"></div>
    
    <script>
        const SERVER_URL = 'http://localhost:8765';
        let ws = null;
        let reconnectAttempts = 0;
        
        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="time">[${time}]</span> ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }
        
        function connect() {
            log('Conectando ao servidor...', 'connect');
            ws = new WebSocket(`${SERVER_URL.replace('http', 'ws')}/ws`);
            
            ws.onopen = () => {
                log('Conectado ao servidor!', 'connected');
                document.getElementById('connected').textContent = '✓';
                document.getElementById('connected').style.color = '#00ff88';
                reconnectAttempts = 0;
                fetchState();
            };
            
            setInterval(fetchState, 2000);
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'state') {
                    updateOffice(data.data);
                }
            };
            
            ws.onclose = () => {
                log('Desconectado. Tentando reconectar...', 'disconnect');
                document.getElementById('connected').textContent = '○';
                document.getElementById('connected').style.color = '#ff4444';
                setTimeout(() => connect(), 3000);
            };
            
            ws.onerror = (error) => {
                log('Erro na conexão', 'error');
            };
        }
        
        async function fetchState() {
            try {
                const response = await fetch(`${SERVER_URL}/state`);
                const data = await response.json();
                updateOffice(data);
            } catch (e) {
                log('Erro ao buscar estado', 'error');
            }
        }
        
        function updateOffice(data) {
            const container = document.getElementById('agents-container');
            const existingAgents = {};
            
            container.querySelectorAll('.agent').forEach(el => {
                existingAgents[el.dataset.id] = el;
            });
            
            const agents = data.agents || {};
            const tasks = data.tasks || {};
            
            Object.values(agents).forEach(agent => {
                let el = existingAgents[agent.id];
                if (!el) {
                    el = document.createElement('div');
                    el.className = `agent ${agent.status || 'idle'}`;
                    el.dataset.id = agent.id;
                    el.innerHTML = `
                        <div class="agent-body" style="background: ${agent.color}; color: ${agent.color}"></div>
                        <div class="agent-task"></div>
                        <div class="agent-status">${agent.status || 'idle'}</div>
                    `;
                    container.appendChild(el);
                    log(`Agente ${agent.name} entrou no escritório`, 'agent-add');
                }
                
                el.style.left = agent.x + 'px';
                el.style.top = agent.y + 'px';
                el.className = `agent ${agent.status || 'idle'}`;
                el.querySelector('.agent-status').textContent = agent.status || 'idle';
                el.querySelector('.agent-task').textContent = agent.task || '';
                
                delete existingAgents[agent.id];
            });
            
            Object.values(existingAgents).forEach(el => {
                log(`Agente ${el.dataset.id} saiu`, 'agent-remove');
                el.remove();
            });
            
            document.getElementById('agent-count').textContent = Object.keys(agents).length;
            document.getElementById('online-count').textContent = Object.keys(agents).length;
            document.getElementById('working-count').textContent = Object.values(agents).filter(a => a.status === 'working').length;
            document.getElementById('task-count').textContent = Object.keys(tasks).length;
        }
        
        async function registerAgent(name, color = null) {
            try {
                const response = await fetch(`${SERVER_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, color }
                });
                return await response.json();
            } catch (e) {
                log('Erro ao registrar agente', 'error');
            }
        }
        
        async function addTask(description, assignedTo = null) {
            try {
                const response = await fetch(`${SERVER_URL}/task`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ description, assigned_to: assignedTo }
                });
                const result = await response.json();
                log(`Tarefa adicionada: ${description}`, 'task-add');
                return result;
            } catch (e) {
                log('Erro ao adicionar tarefa', 'error');
            }
        }
        
        async function updateAgentStatus(agentId, status, task = null, x = null, y = null) {
            try {
                await fetch(`${SERVER_URL}/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ agent_id: agentId, status, task, x, y }
                });
            } catch (e) {
                log('Erro ao atualizar status', 'error');
            }
        }
        
        connect();
        
        setInterval(fetchState, 2000);
        
        log('Sistema iniciado. Aguardando conexão...', 'init');
    </script>
</body>
</html>
