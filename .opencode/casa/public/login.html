<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DeliveryBot — Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#090c14;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(255,79,31,.15),transparent)}
.box{width:360px;background:#0f1320;border:1px solid #1e2540;border-radius:20px;padding:44px 38px;box-shadow:0 60px 120px rgba(0,0,0,.8);animation:up .4s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.logo{text-align:center;margin-bottom:36px}
.logo span{font-size:3rem;display:block;margin-bottom:10px}
.logo h1{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;color:#e8ecf8}
.logo p{color:#576080;font-size:.8rem;margin-top:4px}
.f{margin-bottom:16px}
.f label{display:block;font-size:.72rem;color:#576080;font-weight:500;margin-bottom:6px;letter-spacing:.07em;text-transform:uppercase}
.f input{width:100%;background:#161b27;border:1px solid #222840;border-radius:9px;padding:13px 15px;color:#e8ecf8;font-family:'DM Sans',sans-serif;font-size:.94rem;outline:none;transition:border .18s}
.f input:focus{border-color:#ff4f1f}
.btn{width:100%;margin-top:6px;padding:14px;background:#ff4f1f;border:none;border-radius:9px;color:#fff;font-family:'DM Sans',sans-serif;font-size:.96rem;font-weight:700;cursor:pointer;transition:all .18s}
.btn:hover{background:#ff6e3f;transform:translateY(-1px);box-shadow:0 10px 24px rgba(255,79,31,.3)}
.btn:disabled{opacity:.6;transform:none;cursor:not-allowed}
.err{display:none;margin-top:12px;padding:10px 14px;background:rgba(255,51,81,.1);border:1px solid rgba(255,51,81,.3);border-radius:8px;color:#ff3351;font-size:.82rem;text-align:center}
.err.show{display:block}
.cred{text-align:center;margin-top:22px;color:#576080;font-size:.72rem}
.cred strong{color:#8892b8}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <span>🛵</span>
    <h1>DeliveryBot</h1>
    <p>Painel de Controle — Marco Roberto</p>
  </div>
  <div class="f"><label>Usuário</label><input id="u" type="text" placeholder="usuário" autocomplete="username" autofocus/></div>
  <div class="f"><label>Senha</label><input id="p" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
  <button class="btn" id="btn">Entrar no Painel →</button>
  <div class="err" id="err">Usuário ou senha incorretos</div>
  <div class="cred">Desenvolvido por <strong>Marco Roberto</strong></div>
</div>
<script>
async function login() {
  const btn=document.getElementById("btn"),err=document.getElementById("err");
  btn.textContent="Entrando...";btn.disabled=true;err.classList.remove("show");
  try {
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({usuario:document.getElementById("u").value.trim(),senha:document.getElementById("p").value})
    }).then(r=>r.json());
    if(r.ok&&r.token){sessionStorage.setItem("dbtk",r.token);location.href="/painel?token="+r.token;}
    else err.classList.add("show");
  } catch(_){err.classList.add("show");}
  btn.textContent="Entrar no Painel →";btn.disabled=false;
}
document.getElementById("btn").addEventListener("click",login);
document.getElementById("p").addEventListener("keydown",e=>{if(e.key==="Enter")login();});
const tk=sessionStorage.getItem("dbtk");
if(tk)fetch("/api/auth/check",{headers:{"x-token":tk}}).then(r=>r.json()).then(r=>{if(r.ok)location.href="/painel?token="+tk;}).catch(()=>{});
</script>
</body>
</html>
